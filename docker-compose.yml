services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      - frontend
      - auth-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: rabbitstack
      POSTGRES_USER: rabbitstack
      POSTGRES_PASSWORD: rabbitstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbitstack -d rabbitstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    mem_limit: 256m

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      PORT: 3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      USER_SERVICE_QUEUE: user_queue
      VEHICLE_SERVICE_QUEUE: vehicle_queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rabbitstack
      DB_USER: rabbitstack
      DB_PASSWORD: rabbitstack
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_QUEUE: user_queue
      VEHICLE_SERVICE_QUEUE: vehicle_queue
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rabbitstack
      DB_USER: rabbitstack
      DB_PASSWORD: rabbitstack
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vehicle-service:
    build:
      context: ./vehicle-service
    container_name: vehicle-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_QUEUE: vehicle_queue
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rabbitstack
      DB_USER: rabbitstack
      DB_PASSWORD: rabbitstack
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - auth-service

volumes:
  postgres_data:
