services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_DB: rabbitstack
      POSTGRES_USER: rabbitstack
      POSTGRES_PASSWORD: rabbitstack
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbitstack -d rabbitstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    mem_limit: 256m

  auth-service:
    image: node:22-alpine
    container_name: auth-service-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    env_file:
      - ./auth-service/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: "UsePolling"
      TSC_WATCHDIRECTORY: "UsePolling"
      TSC_NONPOLLING_WATCHER: "false"
      PORT: 3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      USER_SERVICE_QUEUE: user_queue
      VEHICLE_SERVICE_QUEUE: vehicle_queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rabbitstack
      DB_USER: rabbitstack
      DB_PASSWORD: rabbitstack
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./auth-service:/app
      - auth_service_node_modules:/app/node_modules

  user-service:
    image: node:22-alpine
    container_name: user-service-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    env_file:
      - ./user-service/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: "UsePolling"
      TSC_WATCHDIRECTORY: "UsePolling"
      TSC_NONPOLLING_WATCHER: "false"
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_QUEUE: user_queue
      VEHICLE_SERVICE_QUEUE: vehicle_queue
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rabbitstack
      DB_USER: rabbitstack
      DB_PASSWORD: rabbitstack
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./user-service:/app
      - user_service_node_modules:/app/node_modules

  vehicle-service:
    image: node:22-alpine
    container_name: vehicle-service-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    env_file:
      - ./vehicle-service/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: "UsePolling"
      TSC_WATCHDIRECTORY: "UsePolling"
      TSC_NONPOLLING_WATCHER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./vehicle-service:/app
      - vehicle_service_node_modules:/app/node_modules

  frontend:
    image: node:22-alpine
    container_name: frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --webpack --hostname 0.0.0.0 --port ${PORT:-3000}"
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
    depends_on:
      - auth-service
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  auth_service_node_modules:
  postgres_dev_data:
  user_service_node_modules:
  vehicle_service_node_modules:
  frontend_node_modules:
